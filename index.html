<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>University Talent Show — Registration</title>
  <meta name="description" content="Registration page for a university talent show: students sign up, and the entries build into a live list.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-body-tertiary">

  <main class="container py-5">

    <header class="mb-4">
      <h1 class="h3 mb-1">University Talent Show</h1>
      <p class="text-secondary mb-0">Register your act, then check the list of everyone taking part.</p>
    </header>

    <div class="row g-4">

      <!-- ---------- registration form ---------- -->
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">Register</h2>

            <form id="registration-form" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="name" class="form-label">Full name</label>
                  <input type="text" class="form-control" id="name" required>
                  <div class="invalid-feedback">Please enter your name.</div>
                </div>

                <div class="col-md-6">
                  <label for="major" class="form-label">Major</label>
                  <input type="text" class="form-control" id="major" required>
                  <div class="invalid-feedback">Please enter your major.</div>
                </div>

                <div class="col-md-6">
                  <label for="student-id" class="form-label">Student ID</label>
                  <input type="text" class="form-control" id="student-id" required>
                  <div class="invalid-feedback">Please enter your student ID.</div>
                </div>

                <div class="col-md-6">
                  <label for="category" class="form-label">Category</label>
                  <select class="form-select" id="category" required>
                    <option value="" selected disabled>Choose…</option>
                  </select>
                  <div class="invalid-feedback">Please choose a category.</div>
                </div>
              </div>

              <div class="d-flex align-items-center gap-3 mt-4">
                <button type="submit" class="btn btn-dark">Add my act</button>
                <span class="text-secondary small">
                  Registered so far: <strong id="count">0</strong>
                </span>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- ---------- registered talents ---------- -->
      <div class="col-lg-5">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h2 class="h5 card-title mb-3">The line-up</h2>

            <ul class="list-group list-group-flush" id="talent-list"></ul>

            <p class="text-secondary small mb-0 mt-3" id="empty-note">
              No acts yet — the first registration will appear here.
            </p>

            <div id="details" class="mt-3"></div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
